pet:'<circle cx="7" cy="10" r="1.8"/><circle cx="12" cy="7.5" r="1.8"/><circle cx="17" cy="10" r="1.8"/><path d="M12 12c-3 0-5 2.5-5 4.5 0 1.5 1.5 2 3 1.7 1-.2 1.5-.4 2-.4s1 .2 2 .4c1.5.3 3-.2 3-1.7 0-2-2-4.5-5-4.5z"/>',
home:'<path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
rep:'<path d="M5 20V10M12 20V4M19 20v-7"/>',

const ico=(k,s)=>SV(IC[k],s);
const todayCh=()=>{const w=new Date().getDay();return S.chore.filter(x=>(!x.ds||x.ds.includes(w))&&(!x.w||diff(x.w,T)<=6))};
const stat=()=>{const ch=todayCh().filter(x=>!done(x)).length,pend=S.rem.filter(x=>!x.ok&&diff(x.w,T)<=ed(x)),late=S.rem.filter(x=>!x.ok&&diff(x.w,T)<0).length,sh=S.shop.filter(x=>!x.ok).length,nx=S.rem.filter(x=>!x.ok).sort((a,b)=>a.w>b.w?1:-1)[0];return{ch,rm:pend.length,late,sh,nx,left:ch+pend.length}};
const sumcard=()=>{const s=stat();return `<section class=td><div class=tdh><span>وضعیت امروز</span><b>${s.left?fa(s.left)+' مورد باقی‌مانده':'همه‌چیز مرتبه'}</b></div><div class=tds><button onclick="openp('chore')"><b>${fa(s.ch)}</b><span>کار امروز</span></button><button onclick="openp('rem')"><b>${fa(s.rm)}</b><span>یادآور فعال</span></button><button onclick="openp('shop')"><b>${fa(s.sh)}</b><span>قلم خرید</span></button></div>${s.nx?`<p class=tdn>${s.late?'عقب‌افتاده':'یادآور بعدی'}: ${esc(s.nx.t)}، ${lab(s.nx.w)}</p>`:''}</section>`};
const hbody=()=>sumcard()+`<div class=hm>${Object.keys(TT).map(k=>`<button onclick="openp('${k}')"><i class=ic>${ico(k,24)}</i><span class=tt><b>${TT[k]}</b><small>${esc(tsum(k))}</small></span></button>`).join('')}</div>`;
function gres(){const q=gq.trim();GR=[];const add=(t,s,f)=>{if(GR.length<14)GR.push([t,s,f])},has=x=>String(x||'').includes(q);
Object.keys(TT).forEach(k=>{if(has(TT[k]))add(TT[k],'بخش',()=>openp(k))});
S.shop.forEach(x=>{if(has(x.t))add(x.t,'خرید',()=>openp('shop'))});
S.rem.forEach(x=>{if(has(x.t))add(x.t,'یادآور',()=>openp('rem'))});
S.chore.forEach(x=>{if(has(x.t))add(x.t,'کارها',()=>openp('chore'))});
S.exp.forEach(x=>{if(has(x.t)||has(x.c))add((x.t||x.c)+'، '+fa(x.a),'هزینه',()=>openp('exp'))});
S.pets.forEach(p=>{if(has(p.nm))add(p.nm,'حیوان خانگی',()=>{openp('pet');pv=p.id;ps='feed';render()})});
S.kt.inv.forEach(x=>{if(has(x.nm))add(x.nm,'موجودی آشپزخانه',()=>{openp('ks');kts='inv';kq=x.nm;render()})});
kall().forEach(r=>{if(has(r.n))add(r.e+' '+r.n,'دستور پخت',()=>{openp('ks');kopen(r.id)})});
S.cx.h.forEach(h=>{if(has(h.t))add(h.t,'عادت چالش',()=>openp('ch'))});
WX.forEach(e=>{if(has(e.n)||has(e.e))add(e.n,'تمرین ورزشی',()=>{openp('wk');wts='lib';wxd=e.id;wkv='ex';render()})});
return GR.length?GR.map((r,i)=>`<div class=it style="cursor:pointer" onclick="gact(${i})"><span>${esc(r[0])}<small>${r[1]}</small></span><em>›</em></div>`).join(''):empty('نتیجه‌ای پیدا نشد.')}
function gact(i){GR[i][2]()}
const home=()=>gq.trim()?gres():hbody();
function gsi(v){gq=v;g('mc').innerHTML=home()}
const hdr=()=>{const s=stat();return `<header class=hd><div class=hd1><div><h1>همراه خانه</h1><p>${jd(T,{weekday:'long'})}، ${jd(T,{day:'numeric',month:'long',year:'numeric'})}</p></div><span class="chip ${s.left?'':'ok'}">${s.left?fa(s.left)+' مورد امروز':'امروز آزادی'}</span></div><label class=sb>${ico('sea',18)}<input id=gs type=search placeholder="جست‌وجو در همه بخش‌ها" value="${esc(gq)}" oninput="gsi(this.value)"></label></header>`};
const bnav=()=>`<div class=bn role=navigation>`+[['home','خانه'],['rep','گزارش‌ها']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="gonav('${k}')">${ico(k,22)}<span>${l}</span></button>`).join('')+`<button class=fab onclick="qa=true;render()" aria-label="افزودن سریع">${ico('add',24)}<span>افزودن</span></button><button class="${tab=='set'?'on':''}" onclick="gonav('set')">${ico('set',22)}<span>تنظیمات</span></button></div>`;
function gonav(k){if(tab==k)return;if(k=='home'){tab='home';gq='';nav1=true;render();return}openp(k)}
const QA=[['shop','افزودن خرید','t'],['exp','ثبت هزینه','a'],['rem','یادآور جدید','t'],['chore','کار جدید','t'],['ks','ماده غذایی',''],['wk','شروع تمرین','']];
const qsheet=()=>qa?`<div class=qs onclick="qa=false;render()"><div class=qsh onclick="event.stopPropagation()"><b>افزودن سریع</b><div class=qg>${QA.map(([k,l],i)=>`<button onclick="qadd(${i})"><i class=ic>${ico(k,22)}</i><span>${l}</span></button>`).join('')}</div></div></div>`:'';
function qadd(i){qa=false;const k=QA[i][0],f=QA[i][2];openp(k);if(k=='ks'){kts='inv';ked='new';KP=null;render()}if(k=='wk'){wts='today';wkv=null;render()}setTimeout(()=>{const e=f&&g(f);if(e&&e.focus)e.focus()},60)}
const rcard=(t,k,b)=>`<section class=rc><div class=rch><b>${t}</b><button class=gh2 onclick="openp('${k}')">نمایش</button></div>${b}</section>`;
const rrow=(a,b)=>`<div class=rr><span>${a}</span><b>${b}</b></div>`;
V.rep=()=>{const mk=jd(T,MK),cur=S.exp.filter(e=>jd(e.w,MK)==mk),tot=cur.reduce((s,e)=>s+e.a,0),p0=cp(dt(T)),pm=p0.month==1?[p0.year-1,12]:[p0.year,p0.month-1],pk=jd(toIso(pm[0],pm[1],1),MK),prev=S.exp.filter(e=>jd(e.w,MK)==pk).reduce((s,e)=>s+e.a,0),by={};
cur.forEach(e=>by[e.c]=(by[e.c]||0)+e.a);const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,4),ap=todayCh(),cd=ap.filter(done).length,pend=S.rem.filter(x=>!x.ok),late=pend.filter(x=>diff(x.w,T)<0).length,sh=S.shop,ki=S.kt.inv,soon=ki.filter(x=>x.ex&&diff(x.ex,T)<=3).length,cook=ki.length?kall().map(r=>kmatch(r)).filter(m=>m.cat==0).length:0,none=t=>`<p class=rn>${t}</p>`;
return rcard('هزینه‌ها','exp',tot?rrow('جمع این ماه',fa(tot)+' تومان')+(prev?rrow('ماه قبل',fa(prev)+' تومان')+rrow('تغییر',(tot>=prev?'+':'−')+fa(Math.round(Math.abs(tot-prev)/prev*100))+'٪'):'')+cats.map(([c,v])=>`<div class=rr><span>${esc(c)}</span><b>${fa(v)}</b></div><div class=hb><i style="width:${v/tot*100}%"></i></div>`).join(''):none('هنوز هزینه‌ای برای این ماه ثبت نشده.'))+
rcard('کارهای امروز','chore',ap.length?rrow('انجام‌شده',fa(cd)+' از '+fa(ap.length))+`<div class=hb><i style="width:${cd/ap.length*100}%"></i></div>`:none('برای امروز کاری تعریف نشده.'))+
rcard('یادآورها','rem',S.rem.length?rrow('فعال',fa(pend.length))+rrow('عقب‌افتاده',fa(late))+rrow('انجام‌شده',fa(S.rem.length-pend.length)):none('یادآوری ثبت نشده.'))+
rcard('لیست خرید','shop',sh.length?rrow('مونده',fa(sh.filter(x=>!x.ok).length))+rrow('خریده‌شده',fa(sh.filter(x=>x.ok).length)):none('لیست خرید خالیه.'))+
rcard('چالش ۷۵ روزه','ch',`<p class=rn>${esc(xsum())}</p>`)+
rcard('حیوان خانگی','pet',S.pets.length?S.pets.map(p=>rrow(esc(p.nm),esc(pnext(p)||'مورد نزدیکی نیست'))).join(''):none('حیوانی ثبت نشده.'))+
rcard('آشپزخانه','ks',ki.length?rrow('مواد موجود',fa(ki.length))+rrow('نزدیک یا گذشته از انقضا',fa(soon))+rrow('غذای قابل تهیه',fa(cook)):none('موجودی ثبت نشده.'))+rcard('مربی ورزش','wk',S.wk.log.length?(()=>{const w=wstats();return rrow('جلسه‌های انجام‌شده',fa(w.n))+rrow('مجموع زمان',fa(w.min)+' دقیقه')+rrow('روزهای فعالیت',fa(w.days))})():none('هنوز تمرینی ثبت نشده.'))};
V.set=()=>{const row=(t,s,c)=>`<div class=it><span>${t}<small>${s}</small></span>${c}</div>`;
return `<p class=lb>ظاهر و تاریخ</p>`+row('نوع تقویم','تاریخ‌ها در همه بخش‌ها',`<button class=gh2 onclick="tcal()">${S.cal=='g'?'میلادی':'شمسی'}</button>`)+
`<p class=lb>اعلان‌ها</p><div class=it><label><input type=checkbox ${S.cm?'checked':''} onchange="tcm()"><span>یادآوری آخر ماه برای چک‌ها<small>اعلان خلاصه چک‌های ماه بعد</small></span></label></div><div class=it><label><input type=checkbox ${S.cx.nt?'checked':''} onchange="xnt()"><span>اعلان عادت‌های چالش<small>با خاموش کردنش هیچ یادآوری عادتی ارسال نمی‌شه</small></span></label></div>`+
`<p class=lb>آشپزخانه</p>`+row('حساسیت‌ها، مواد پایه و یادآوری انقضا','',`<button class=gh2 onclick="openp('ks');kts='set';render()">باز کردن</button>`)+
`<p class=lb>پشتیبان‌گیری و بازیابی</p><div class=fm><button onclick="sbk()">کپی پشتیبان همه اطلاعات</button><textarea id=bk2 rows=3 placeholder="برای بازیابی، متن پشتیبان رو اینجا بچسبون"></textarea><button class=gh2 onclick="srs()">بازیابی از متن پشتیبان</button></div><p class=lb>عکس‌ها توی پشتیبان نیستن.</p>`+
`<p class=lb>درباره برنامه</p><div class=it style="display:block"><b>همراه خانه</b><small>همه اطلاعات فقط روی همین گوشی ذخیره می‌شه و برنامه برای کار کردن به اینترنت نیاز نداره.</small></div>`};
function sbk(){const j=JSON.stringify(S),t=g('bk2');t.value=j;try{t.select()}catch(e){}try{navigator.clipboard.writeText(j).then(()=>toast('پشتیبان کپی شد'),()=>toast('متن رو دستی کپی کن'))}catch(e){toast('متن رو دستی کپی کن')}}
function srs(){try{const o=JSON.parse(val('bk2'));if(!o||!Array.isArray(o.shop))throw 0;if(!sbq){sbq=true;toast('دوباره بزن تا اطلاعات فعلی با پشتیبان جایگزین بشه');setTimeout(()=>sbq=false,5000);return}if(!Array.isArray(o.pets))o.pets=[];if(o.cm==null)o.cm=1;if(!o.cal)o.cal='j';S=o;sbq=false;save();location.reload()}catch(e){toast('متن پشتیبان معتبر نیست')}}
function openp(k){tab=k;pv=null;nav1=true;try{history.pushState({k},'')}catch(e){}render();try{scrollTo(0,0)}catch(e){}}
function back(){if(qa){qa=false;render();return}if(tab=='wk'&&(wkv||wendq)){wkBack();return}if(tab=='ks'&&kv){kv=null;render();return}if(pvw){pvw=null;pdel=false;render();return}if(tab=='pet'&&pv){pv=null;render();return}if(history.state&&history.state.k)history.back();else{tab='home';nav1=true;render()}}
function toast(m){const d=document.createElement('div');d.className='ts';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2000)}
let bt=0;
const AP=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;
if(AP&&AP.addListener)AP.addListener('backButton',()=>{if(qa||tab!='home'){back();return}const n=Date.now();if(n-bt<2000){AP.exitApp();return}bt=n;toast('برای خروج، یک بار دیگه برگشت رو بزن')});
window.addEventListener('popstate',()=>{if(tab=='pet'&&pv){pv=null;try{history.pushState({k:'pet'},'')}catch(e){}}else tab='home';render()});
function render(){T=iso();const nv=tab=='home'||tab=='rep'||tab=='set';if(document.body)document.body.className=nv?'hn':'';const pa=nav1?' class=pa':'';nav1=false;
g('app').innerHTML=(tab=='home'?hdr()+`<main id=mc${pa}>${home()}</main>`:`<header class=sh><div class=hr>${nv?'<span style="width:64px"></span>':'<button class=cb onclick="back()">‹ منو</button>'}<h1>${TT[tab]||TT2[tab]}</h1><span style="width:64px"></span></div></header><main${pa}>${V[tab]()}</main>`)+(nv?bnav():'')+qsheet()}
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.tagName=='INPUT'){const f=e.target.closest('.fm');f&&f.querySelector('button').click()}});
render();monthly();phLoad();xsch();wsync();
</script>
