name: build-apk
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications @capacitor/app
          npx cap init "همراه خانه" com.hamrahkhane.app --web-dir=www
          mkdir -p www && cp index.html www/
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "EXACT_ALARM" android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
